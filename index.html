<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliment Generator | Modern UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <div class="card">
            <header>
                <h1>Kind Words</h1>
            </header>
            
            <div class="compliment-display">
                <p id="compliment-text">Click the button below to brighten your day!</p>
            </div>

            <button id="generate-btn" class="primary-btn">Get a New Compliment</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
